name: Java CI/CD Pipeline

on:
 push:
  branches:
   - main

jobs:
 test:
  name: Run Tests with JaCoCo
  runs-on: ubuntu-latest
  steps:
   # Paso 1: Descargar el repositorio
   - name: Checkout code
     uses: actions/checkout@v4

   # Paso 2: Configurar el JDK 17
   - name: Set up JDK 17
     uses: actions/setup-java@v3
     with:
      distribution: 'temurin'
      java-version: '17'

   # Paso 3: Cache de dependencias de Maven
   - name: Cache Maven dependencies
     uses: actions/cache@v3
     with:
      path: ~/.m2
      key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
      restore-keys: |
       ${{ runner.os }}-m2

   # Paso 4: Compilar y ejecutar pruebas (genera cobertura)
   - name: Build and test
     run: mvn clean verify

   # Paso 5: Publicar el reporte de cobertura de JaCoCo
   - name: Upload JaCoCo Report
     uses: actions/upload-artifact@v4
     with:
      name: jacoco-report
      path: target/site/jacoco/

 build:
  name: Build Jar
  runs-on: ubuntu-latest
  needs: test

  steps:
   - name: Checkout code
     uses: actions/checkout@v4

   - name: Set up JDK 17
     uses: actions/setup-java@v3
     with:
      distribution: 'temurin'
      java-version: '17'

   - name: Package application
     run: mvn clean package -DskipTests

   - name: Upload JAR artifact
     uses: actions/upload-artifact@v4
     with:
      name: app-jar
      path: target/*.jar

  snyk:
    name: Analisis de dependencias (Snyk / SCA)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Instalar dependencias
        run: npm install

      - name: Analizar con Snyk
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

  sonarcloud:
    name: Analisis de codigo (SonarCloud / SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Analizar con SonarCloud
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
